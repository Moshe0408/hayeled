<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>הילד מהשכונה - לוגו</title>
<style>
  body{margin:0;font-family:Heebo,system-ui,sans-serif;background:#050B1A;color:#9FB3D1}
  .row{display:flex;flex-wrap:wrap}
  .tile{flex:1 1 360px;min-height:440px;display:grid;place-items:center;padding:32px;box-sizing:border-box}
  .dark{background:radial-gradient(120% 90% at 50% 20%,#11305A 0%,#06112A 55%,#03070F 100%)}
  .light{background:#F2F4F8}
  .tile img{width:min(520px,90%);height:auto}
  .icons{display:flex;gap:28px;align-items:flex-end;justify-content:center;padding:32px;background:#0A1426}
  .icons img{border-radius:22%;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  h2{font-weight:700;font-size:13px;letter-spacing:.08em;margin:0;padding:12px 20px;color:#6E83A6}
</style></head>
<body>
  <div class="row">
    <div class="tile dark" id="dark"><img src="logo.svg" alt="הילד מהשכונה"></div>
    <div class="tile light"><img src="logo.svg" alt="הילד מהשכונה"></div>
  </div>
  <h2>אייקון אפליקציה · 192 / 96 / 48</h2>
  <div class="icons"><img src="icon.svg" width="192" height="192" alt=""><img src="icon.svg" width="96" height="96" alt=""><img src="icon.svg" width="48" height="48" alt=""><img src="emblem.svg" width="90" alt=""></div>
</body></html>
