<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>הילד מהשכונה</title>
  <meta name="description" content="הילד מהשכונה: משחק קריירה של כדורגלן. מהשכונה ועד הבאלון ד'אור. מתחילים באקדמיה בגיל 15 ומגיעים עד ליגת האלופות, המונדיאל וכדור הזהב.">
  <meta name="theme-color" content="#050B1A">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="הילד מהשכונה">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Rubik:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/theme.css">
</head>
<body>
  <div id="app">
    <div class="splash" role="status" aria-live="polite">
      <div class="logo-ball" aria-hidden="true"></div>
      <div class="splash-title">הילד מהשכונה</div>
      <div class="splash-sub">טוען...</div>
    </div>
  </div>
  <noscript>
    <div class="noscript">כדי לשחק בהילד מהשכונה צריך להפעיל JavaScript בדפדפן.</div>
  </noscript>
  <script>
    // Boot watchdog: if the game did not start (very old browser or a failed download), show a friendly message.
    setTimeout(function () {
      if (window.__hyBooted) return;
      var s = document.querySelector('.splash-sub');
      if (!s) return;
      s.innerHTML = 'הטעינה לוקחת יותר מהרגיל. <button type="button" class="btn btn-primary" onclick="location.reload()">נסה שוב</button>';
    }, 15000);
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
